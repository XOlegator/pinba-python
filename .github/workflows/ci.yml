name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install '.[test,dev]' build
      - run: pre-commit run --all-files
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/pinba-wheel
          /tmp/pinba-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/pinba-wheel/bin/python -c 'from pinba import Collector, PinbaMiddleware, Reporter'
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
  protobuf-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install '.[test]'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: python scripts/check_proto.py
      - run: python -m pytest -q tests/test_proto.py
