name: Publish GitHub release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Check release commit
        id: release
        run: |
          subject=$(git show -s --format=%s HEAD)
          version=$(python -c 'import json; print(json.load(open(".release-state.json"))["version"])')
          if [ "$subject" = "chore(release): prepare v${version}" ] && git diff-tree --no-commit-id --name-only -r HEAD | grep -qx '.release-state.json'; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        if: steps.release.outputs.version != ''
        run: |
          python -m pip install build
          python -m build
      - name: Publish release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          python -c 'import pathlib,sys; s=pathlib.Path("CHANGELOG.md").read_text(); section=s.split("\n## "+sys.argv[1]+" (",1)[1].split("\n## ",1)[0]; pathlib.Path("/tmp/notes.md").write_text(section.split("\n",1)[1])' "$VERSION"
          gh release create "v$VERSION" dist/* --target "${{ github.event.workflow_run.head_sha }}" --title "v$VERSION" --notes-file /tmp/notes.md
        
