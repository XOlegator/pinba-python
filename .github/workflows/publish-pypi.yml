name: Publish to PyPI
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Check release commit
        id: release
        run: |
          version=$(python -c 'import json; print(json.load(open(".release-state.json"))["version"])')
          subject=$(git show -s --format=%s HEAD)
          if [ "$subject" = "chore(release): prepare v${version}" ] && git diff-tree --no-commit-id --name-only -r HEAD | grep -qx '.release-state.json'; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        if: steps.release.outputs.release == 'true'
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.release == 'true'
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pinba-python
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
