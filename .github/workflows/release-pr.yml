name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python scripts/prepare_release.py
      - name: Determine version
        id: version
        run: echo "version=$(python -c 'import json; print(json.load(open(".release-state.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/release
          delete-branch: true
          commit-message: 'chore(release): prepare v${{ steps.version.outputs.version }}'
          title: 'chore(release): prepare v${{ steps.version.outputs.version }}'
          body: 'Automated release preparation. Review the version, eligible changes and changelog, then squash merge after CI passes.'
          add-paths: |
            .release-state.json
            CHANGELOG.md
            pyproject.toml
